repos:

  # ── General file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key        # blocks commits containing PEM private keys
      - id: no-commit-to-branch       # protect main/master
        args: ["--branch", "main", "--branch", "master"]

  # ── Python: Ruff lint + format (replaces flake8, isort, pyupgrade) ────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
        exclude: ^backend/venv/
      - id: ruff-format
        files: ^backend/
        exclude: ^backend/venv/

  # ── Python: Bandit security scan ─────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-ll", "-s", "B101,B110"]   # skip: assert_used, try/except/pass
        exclude: ^backend/venv/

  # ── Secrets detection (catches API keys, tokens, passwords in diffs) ──────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.env\.example|.*\.lock)$
